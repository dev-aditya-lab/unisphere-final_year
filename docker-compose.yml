# UniSphere: web app + background worker + Redis.
#
# Supabase (Postgres, Auth, Realtime) is NOT part of this file. Use a Supabase project (hosted, or self-hosted
# following Supabase's own compose) and apply the migrations in supabase/migrations/ to it.
#
#   cp .env.example .env.docker      # fill it in (see docs/DEPLOYMENT.md)
#   docker compose --env-file .env.docker up -d --build
#
# NEXT_PUBLIC_* values are compiled into the browser bundle, so they come from the same file as BUILD arguments
# below. If you change one, run `docker compose --env-file .env.docker build app` again.

name: unisphere

services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL (the public https URL)}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL:-}
    image: unisphere:latest
    restart: unless-stopped
    env_file: .env.docker
    environment:
      NODE_ENV: production
      # Inside the compose network Redis is reachable by service name, whatever .env.docker says.
      REDIS_URL: redis://redis:6379
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      target: worker
    image: unisphere-worker:latest
    restart: unless-stopped
    environment:
      WORKER_TARGET_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET (openssl rand -hex 32)}
      WORKER_INTERVAL_SEC: ${WORKER_INTERVAL_SEC:-30}
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis holds rate-limit counters and short-lived caches only: losing it is harmless, so no persistence needed.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
