# The background worker for hosts that cannot run a long-lived process (Vercel, Render's free plan).
# Every 5 minutes it calls the app's tick endpoint, which sends queued emails and push notifications,
# event reminders, embeddings and scheduled account deletions. It also keeps a sleeping free instance awake.
#
# Setup (repository Settings -> Secrets and variables -> Actions):
#   secret   CRON_SECRET   the same value as the app's CRON_SECRET
#   variable APP_URL       the public URL, e.g. https://unisphere.onrender.com   (no trailing slash)
name: worker-tick
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay scheduled runs by a few minutes under load
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/tick
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then echo "APP_URL variable and CRON_SECRET secret are required"; exit 1; fi
          # Wake a sleeping free instance first (it can take up to ~60 seconds).
          curl --silent --show-error --max-time 90 --retry 3 --retry-delay 10 "${APP_URL}/api/health" > /dev/null
          code=$(curl --silent --show-error --max-time 60 --output /tmp/tick.json --write-out '%{http_code}' \
                   -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/cron/tick")
          echo "tick -> HTTP ${code}"
          cat /tmp/tick.json
          [ "${code}" = "200" ]
