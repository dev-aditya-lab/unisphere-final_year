name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit tests, audit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      # Production dependencies only: a vulnerable lint tool is not shipped to anyone. Fails on high and critical.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build
        env:
          # Placeholders: the build needs the variables to exist, never real values.
          NEXT_PUBLIC_APP_URL: https://ci.example.test
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      # Turbopack leaves one empty (53-byte, no sources) placeholder map; a real source map is far larger.
      - name: No browser source maps in the build
        run: test -z "$(find .next/static -name '*.map' -size +1k | head -1)"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database:
    name: Row Level Security and database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a local Supabase stack (applies every migration)
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,storage-api,inbucket
      - name: Integration tests
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export SUPABASE_SECRET_KEY="$SECRET_KEY"
          npm run test:rls
