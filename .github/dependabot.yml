version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates arrive together so they can be reviewed and tested once.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The framework and React are upgraded on purpose, with the release notes read (see AGENTS.md).
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
