<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm your new UniSphere email</title></head>
<body style="margin:0;padding:0;background:#F7F5EF;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F5EF;padding:32px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
      <tr><td style="padding:0 0 20px;font-family:Manrope,Arial,sans-serif;font-size:20px;font-weight:800;color:#17243A;">
        <img src="{{ .SiteURL }}/logo-mark.png" width="28" height="28" alt="" style="vertical-align:middle;margin-right:8px;border-radius:6px;background:#F7F5EF;">UniSphere
      </td></tr>
      <tr><td style="background:#ffffff;border:1px solid #E3E6ED;border-radius:12px;padding:32px 28px;font-family:Inter,Arial,sans-serif;">
        <h1 style="margin:0 0 16px;font-family:Manrope,Arial,sans-serif;font-size:22px;line-height:1.3;color:#17243A;">Confirm your new email</h1>
        <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#17243A;">Confirm that <strong>{{ .NewEmail }}</strong> should be the email address for your UniSphere account.</p>
        <p style="margin:8px 0 24px;"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/settings/security" style="display:inline-block;padding:12px 22px;background:#3546A8;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:600;font-size:15px;">Confirm new email</a></p>
        <p style="margin:0;font-size:13px;line-height:1.5;color:#5B667B;">If you did not request this change, secure your account and ignore this email.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
